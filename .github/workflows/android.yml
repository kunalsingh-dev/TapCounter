name: Android CI

on:
  push:
    branches: ['**']   # main or any branch you push to
  workflow_dispatch:

permissions:
  contents: write   # needed to publish the APK as a GitHub Release

env:
  NDK_VERSION: "27.0.12077973"
  CMAKE_VERSION: "3.22.1"
  GRADLE_VERSION: "8.10.2"

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: C++ gesture engine tests (ASan + UBSan)
        run: bash app/src/test/cpp/run_native_tests.sh

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Install NDK + CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;${NDK_VERSION}" "cmake;${CMAKE_VERSION}"

      - name: Kotlin unit tests
        run: |
          set -o pipefail
          gradle :app:testDebugUnitTest --stacktrace --console=plain 2>&1 | tee gradle.log

      - name: Show the Gradle error on the run page
        if: failure()
        run: |
          msg=$(grep -E -A4 '^e: |error:|What went wrong|FAILED' gradle.log | head -25 | sed ':a;N;$!ba;s/\n/%0A/g' || true)
          echo "::error title=Gradle error (tests)::${msg}"
          { echo '### Gradle error (tests)'; echo '```'; grep -E -A6 '^e: |error:|What went wrong|FAILED' gradle.log | head -60 || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Gradle log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-log-tests
          path: gradle.log

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/

  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Install NDK + CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;${NDK_VERSION}" "cmake;${CMAKE_VERSION}"

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle :app:assembleDebug --stacktrace --console=plain 2>&1 | tee gradle.log

      - name: Show the Gradle error on the run page
        if: failure()
        run: |
          msg=$(grep -E -A4 '^e: |error:|What went wrong|FAILED' gradle.log | head -25 | sed ':a;N;$!ba;s/\n/%0A/g' || true)
          echo "::error title=Gradle error (build)::${msg}"
          { echo '### Gradle error (build)'; echo '```'; grep -E -A6 '^e: |error:|What went wrong|FAILED' gradle.log | head -60 || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Gradle log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-log-build
          path: gradle.log

      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "TapCounter-build-${{ github.run_number }}.apk"

      - name: Keep APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: tapcounter-apk
          path: TapCounter-build-${{ github.run_number }}.apk

      - name: Publish APK as GitHub Release (download straight on your phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: TapCounter build ${{ github.run_number }} (${{ github.ref_name }})
          prerelease: ${{ github.ref != 'refs/heads/main' }}
          files: TapCounter-build-${{ github.run_number }}.apk
